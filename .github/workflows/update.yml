name: Update SecSpider Data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'
jobs:
  run-spider:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests feedparser beautifulsoup4 python-dotenv

      - name: Show dir debug
        run: ls -la && ls -la spider && ls -la data

      - name: Run spider
        run: |
          cd spider
          python spider.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git status
          git diff --cached
          git diff --cached --quiet || (git commit -m "auto update sec data $(date)" && git push)
          git diff --cached --quiet && echo "No new data to commit"
