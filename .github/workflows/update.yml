name: Update SecSpider Data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
jobs:
  run-spider:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          cd spider
          pip install -r requirements.txt
      - name: Run spider
        run: |
          cd spider
          python spider.py
      - name: Commit & Push
        run: |
          git config --global user.name "SecSpider Bot"
          git config --global user.email "bot@secspider.local"
          git add data/data.json
          git diff --quiet && echo "No new data" || (git commit -m "auto update alerts" && git push)
