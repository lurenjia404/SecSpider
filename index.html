<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecSpider 安全情报</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#121417;
  color:#e5e7eb;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:24px;
}
.container{max-width:1400px;margin:0 auto}
.header{margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.header-left{flex:1;min-width:320px}
h1{font-size:24px;color:#60a5fa;margin-bottom:12px}
.search-bar{
  width:100%;
  background:#1f2937;
  border:1px solid #374151;
  color:#fff;
  padding:10px 14px;
  border-radius:6px;
  font-size:15px;
  outline:none;
}
.search-bar:focus{border-color:#3b82f6}
.filter-row{margin:12px 0;display:flex;gap:8px;flex-wrap:wrap}
.filter-tag{
  padding:6px 12px;
  border-radius:4px;
  background:#1f2937;
  cursor:pointer;
  font-size:14px;
  user-select:none;
}
.filter-tag.active{background:#2563eb;color:#fff}
#exportBtn{
  padding:9px 14px;
  background:#059669;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  white-space:nowrap;
}
#exportBtn:hover{background:#047857}
.table-wrap{
  overflow:auto;
  border:1px solid #272a30;
  border-radius:8px;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}
thead{
  background:#1f2937;
  position:sticky;
  top:0;
}
th,td{
  text-align:left;
  padding:12px 14px;
  border-bottom:1px solid #272a30;
  font-size:14px;
}
th{font-weight:600;color:#cbd5e1}
tbody tr:hover{background:#1a1d23}
.level-critical{
  background:#dc2626;
  color:#fff;
  padding:3px 8px;
  border-radius:4px;
  font-size:12px;
}
.level-high{
  background:#ea580c;
  color:#fff;
  padding:3px 8px;
  border-radius:4px;
  font-size:12px;
}
.level-medium{
  background:#ca8a04;
  color:#fff;
  padding:3px 8px;
  border-radius:4px;
  font-size:12px;
}
.level-low{
  background:#0284c7;
  color:#fff;
  padding:3px 8px;
  border-radius:4px;
  font-size:12px;
}
.level-info{
  background:#4b5563;
  color:#fff;
  padding:3px 8px;
  border-radius:4px;
  font-size:12px;
}
a{color:#60a5fa;text-decoration:none}
a:hover{text-decoration:underline}
.desc-row{
  background:#17191e;
}
.desc-cell{
  padding:14px;
  color:#b8c2cc;
  font-size:13px;
  line-height:1.6;
}
.pagination{
  margin-top:16px;
  display:flex;
  gap:10px;
  align-items:center;
}
.pagination button{
  padding:7px 14px;
  background:#1f2937;
  color:#fff;
  border:1px solid #374151;
  border-radius:4px;
  cursor:pointer;
}
.pagination button:disabled{opacity:0.4;cursor:not-allowed}
.stat{color:#9ca3af;font-size:14px;margin-left:10px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <h1>SecSpider 安全情报</h1>
      <input class="search-bar" id="search" placeholder="搜索标题、CVE、关键词...">
      <div class="filter-row" id="filters">
        <div class="filter-tag active" data-filter="all">全部</div>
        <div class="filter-tag" data-filter="critical">严重</div>
        <div class="filter-tag" data-filter="high">高危</div>
        <div class="filter-tag" data-filter="medium">中危</div>
        <div class="filter-tag" data-filter="low">低危</div>
      </div>
    </div>
    <button id="exportBtn">导出筛选结果JSON</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>时间</th>
          <th>等级</th>
          <th>标题</th>
          <th>CVE</th>
          <th>来源</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pagination">
    <button id="prev">上一页</button>
    <span id="page-info">第1页</span>
    <button id="next">下一页</button>
    <span class="stat" id="total">总数：0</span>
  </div>
</div>

<script>
const tbody = document.getElementById('tbody');
const searchInput = document.getElementById('search');
const filters = document.getElementById('filters');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const pageInfo = document.getElementById('page-info');
const totalEl = document.getElementById('total');
const exportBtn = document.getElementById('exportBtn');

let rawList = [];
let showList = [];
let page = 1;
const pageSize = 20;
let activeFilter = 'all';

async function loadData(){
  try{
    const res = await fetch('data/data.json');
    const json = await res.json();
    rawList = json.items || [];
    filterAndRender();
  }catch(e){
    tbody.innerHTML = `<tr><td colspan="5">数据加载失败</td></tr>`;
  }
}

function filterAndRender(){
  const kw = searchInput.value.trim().toLowerCase();
  showList = rawList.filter(item=>{
    const matchKw = !kw || (
      item.title?.toLowerCase().includes(kw) ||
      item.cve?.toLowerCase().includes(kw) ||
      item.desc?.toLowerCase().includes(kw)
    );
    const matchLevel = activeFilter === 'all' || item.level?.toLowerCase() === activeFilter;
    return matchKw && matchLevel;
  })
  page = 1;
  render();
}

function render(){
  const total = showList.length;
  const maxPage = Math.ceil(total / pageSize);
  if(page > maxPage && maxPage>0) page = maxPage;
  if(page < 1) page =1;
  const start = (page-1)*pageSize;
  const pageData = showList.slice(start, start+pageSize);

  pageInfo.textContent = `第${page}页 / ${maxPage||1}页`;
  totalEl.textContent = `总数：${total}`;
  prevBtn.disabled = page <=1;
  nextBtn.disabled = page >= maxPage;

  tbody.innerHTML = '';
  pageData.forEach(item=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.time || '-'}</td>
      <td><span class="level-${(item.level||'info').toLowerCase()}">${item.level||'未知'}</span></td>
      <td><a href="${item.url||'#'}" target="_blank">${item.title||''}</a></td>
      <td>${item.cve || '-'}</td>
      <td>${item.source || '-'}</td>
    `;
    tbody.appendChild(tr);
    tr.style.cursor = 'pointer';
    tr.onclick = (e)=>{
      if(e.target.tagName === 'A') return;
      const nextTr = tr.nextElementSibling;
      if(nextTr && nextTr.classList.contains('desc-row')){
        nextTr.remove();
      }else{
        const descTr = document.createElement('tr');
        descTr.className = 'desc-row';
        descTr.innerHTML = `<td colspan="5" class="desc-cell">${item.desc || '无描述'}</td>`;
        tr.after(descTr);
      }
    }
  })
}

// 导出筛选后的json
exportBtn.onclick = ()=>{
  const blob = new Blob([JSON.stringify(showList, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `secspider_${new Date().toISOString().slice(0,19)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

searchInput.oninput = filterAndRender;
filters.addEventListener('click', e=>{
  if(e.target.classList.contains('filter-tag')){
    document.querySelectorAll('.filter-tag').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    activeFilter = e.target.dataset.filter;
    filterAndRender();
  }
})
prevBtn.onclick = ()=>{page--;render()}
nextBtn.onclick = ()=>{page++;render()}

loadData();
</script>
</body>
</html>
